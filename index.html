<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E6FB8">
<title>برنامه‌ریز کشیک اینترن‌ها</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>برنامه‌ریز کشیک اینترن‌ها</h1>
  <button type="button" id="resetAll" class="link-btn">شروع از اول</button>
</header>
<main id="app"></main>
<noscript><p class="card">برای استفاده از این برنامه باید جاوااسکریپت مرورگر روشن باشد.</p></noscript>

<div id="panel" class="panel-wrap" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
    <h3 id="panelTitle"></h3>
    <label for="panelInput">سختی این کشیک</label>
    <input id="panelInput" type="text" inputmode="decimal" autocomplete="off">
    <p class="hint">عددی بین ۰٫۲۵ تا ۵ بنویسید. مثلاً ۱٫۷۵</p>
    <p class="error" id="panelErr"></p>
    <div class="row">
      <button type="button" class="btn primary" id="panelOk">ثبت</button>
      <button type="button" class="btn" id="panelReset">مقدار اولیه</button>
      <button type="button" class="btn" id="panelCancel">انصراف</button>
    </div>
  </div>
</div>

<script src="jalali.js"></script>
<script src="scheduler.js"></script>
<script src="app.js"></script>
</body>
</html>
